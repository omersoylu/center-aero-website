name: Deploy to Natro

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: natro-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if FTP secrets are not configured
        if: env.FTP_HOST == ''
        run: echo "FTP_HOST secret yok; yayın adımı atlandı. Repo → Settings → Secrets and variables → Actions altında FTP_HOST, FTP_USER, FTP_PASSWORD ekleyin."

      - uses: actions/setup-node@v4
        if: env.FTP_HOST != ''
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.FTP_HOST != ''
        run: npm ci

      - name: Build (static export)
        if: env.FTP_HOST != ''
        run: npm run build

      - name: Upload to Natro via FTPS
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./out/
          server-dir: /centeraero.com/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
