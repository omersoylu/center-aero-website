name: Deploy to Natro

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: natro-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if FTP secrets are not configured
        if: env.FTP_HOST == ''
        run: echo "FTP_HOST secret yok; yayın adımı atlandı. Repo → Settings → Secrets and variables → Actions altında FTP_HOST, FTP_USER, FTP_PASSWORD ekleyin."

      - uses: actions/setup-node@v4
        if: env.FTP_HOST != ''
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.FTP_HOST != ''
        run: npm ci

      - name: Build (static export)
        if: env.FTP_HOST != ''
        run: npm run build

      - name: Check secret formatting (lengths only, values stay hidden)
        if: env.FTP_HOST != ''
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP_HOST uzunluk: ${#FTP_HOST}  (89.19.30.91 için 11 olmalı)"
          echo "FTP_USER uzunluk: ${#FTP_USER}  (u2862044 için 8 olmalı)"
          echo "FTP_PASSWORD uzunluk: ${#FTP_PASSWORD}"
          for v in FTP_HOST FTP_USER FTP_PASSWORD; do
            val="${!v}"
            if [ "$val" != "$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ]; then echo "UYARI: $v başında/sonunda boşluk var"; fi
          done

      - name: Upload to Natro via FTPS
        if: env.FTP_HOST != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./out/
          # u2862044 centeraero.com'a özel FTP hesabı: kökü doğrudan site klasörü.
          # Ana hesap (u2851938) kullanılırsa /centeraero.com/ yapın.
          server-dir: ${{ vars.FTP_REMOTE_DIR || '/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
